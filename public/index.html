<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sysmatixx Front Desk</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="desk">
    <header class="top">
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <strong>FRONT DESK</strong>
      <span class="live"><span class="dot"></span> LIVE, 24/7</span>
    </header>

    <section class="board" aria-label="Channels and outcomes">
      <div class="channels" id="channels">
        <button type="button" class="channel active" data-channel="phone"><span class="icon">☎</span>Phone</button>
        <button type="button" class="channel" data-channel="whatsapp"><span class="icon">✆</span>WhatsApp</button>
        <button type="button" class="channel" data-channel="sms"><span class="icon">✉</span>SMS</button>
        <button type="button" class="channel" data-channel="email"><span class="icon">✉</span>Email</button>
        <button type="button" class="channel" data-channel="web"><span class="icon">⌖</span>Web form</button>
      </div>
      <div class="hub">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="42" height="42">
            <path d="M16 28v8M24 18v28M32 22v20M40 12v40M48 20v24M56 28v8" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <strong id="hub-name">SYS MATIXX</strong>
        <span id="hub-status">READY</span>
      </div>
      <div class="outcomes">
        <div class="pill" id="pill-booked"><span class="badge">▣</span><b id="count-booked">0</b> Booked</div>
        <div class="pill" id="pill-reminded"><span class="badge">◷</span><b id="count-reminded">0</b> Reminded</div>
        <div class="pill" id="pill-reviewed"><span class="badge">★</span><b id="count-reviewed">0</b> Reviewed</div>
      </div>
    </section>

    <section class="controls">
      <label>Language
        <select id="language">
          <option value="auto">Auto, match the customer</option>
          <option value="en">English</option>
          <option value="ur">Urdu</option>
          <option value="ar">Arabic</option>
        </select>
      </label>
      <label>English accent
        <select id="accent-en">
          <option value="us">American</option>
          <option value="gb">British</option>
          <option value="in">South Asian</option>
        </select>
      </label>
      <label>Arabic accent
        <select id="accent-ar">
          <option value="sa">Saudi</option>
          <option value="ae">Emirati</option>
          <option value="eg">Egyptian</option>
          <option value="lb">Lebanese</option>
        </select>
      </label>
      <label>Urdu accent
        <select id="accent-ur">
          <option value="pk">Pakistani</option>
        </select>
      </label>
      <label>Voice
        <select id="gender">
          <option value="female">Female</option>
          <option value="male">Male</option>
        </select>
      </label>
      <label class="check"><input id="speak" type="checkbox" checked> Speak the reply</label>
    </section>

    <fieldset class="jobs">
      <legend>This desk may</legend>
      <label><input type="checkbox" value="answer" checked> Answer questions</label>
      <label><input type="checkbox" value="book" checked> Book appointments</label>
      <label><input type="checkbox" value="remind" checked> Send reminders</label>
      <label><input type="checkbox" value="review" checked> Ask for reviews</label>
      <label><input type="checkbox" value="recover" checked> Recover missed visits</label>
    </fieldset>

    <details class="facts">
      <summary>What the desk is allowed to say</summary>
      <div class="fact-grid">
        <label>Business <input id="biz-name" value="Sysmatixx"></label>
        <label>Location <input id="biz-location" value="27 K Model Town, Lahore"></label>
        <label>Hours <input id="biz-hours" value="Monday to Saturday, 10 in the morning until 7 in the evening"></label>
        <label>Services <input id="biz-services" value="game consultations, project estimates, and social media planning"></label>
      </div>
    </details>

    <section class="thread-wrap">
      <div class="thread-head">
        <span id="channel-label">Phone</span>
        <button type="button" id="reset">New conversation</button>
      </div>
      <div id="samples" class="samples"></div>
      <div id="thread" class="thread" aria-live="polite"></div>
      <form id="composer">
        <input id="message" autocomplete="off" placeholder="What the customer says">
        <button type="submit" id="send">Reply</button>
      </form>
      <audio id="player"></audio>
    </section>
    <p class="note">This is an open conversation in English, Urdu, or Arabic. Speech uses a female or male voice. Phone, WhatsApp, SMS, email, and the web form here are simulated inboxes.</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
